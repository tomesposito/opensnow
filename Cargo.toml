[workspace]
resolver = "2"
exclude = ["vendor/iceberg-0.11.0"]
members = ["crates/opensnow-engine", "crates/opensnow-storage", "crates/opensnow-control", "crates/opensnow-mcp", "crates/stack-check"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
datafusion = "=54.1.0"
arrow = "=58.4.1"
iceberg = "=0.11.0"
iceberg-datafusion = "=0.11.0"
iceberg-catalog-sql = "=0.11.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
futures = "=0.3.34"
tempfile = "=3.27.0"
# The catalog enables no SQLx runtime. Supply it in the consumer.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any"] }
uuid = { version = "=1.29.0", features = ["v7"] }
opensnow-engine = { path = "crates/opensnow-engine" }
opensnow-storage = { path = "crates/opensnow-storage" }
opensnow-control = { path = "crates/opensnow-control" }
sha2 = "=0.10.9"
hmac = "=0.12.1"
rand = "=0.8.8"
hex = "=0.4.3"
subtle = "=2.6.1"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
opensnow-mcp = { path = "crates/opensnow-mcp" }

[profile.dev]
debug = 0

# Password hashing is CPU-bound by design. Unoptimized debug code makes
# PBKDF2 roughly an order of magnitude slower than the release build the
# provisioning time bar is written for, so the crypto path is optimized
# in dev builds too. No other package changes profile.
[profile.dev.package.opensnow-control]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.hmac]
opt-level = 2

[patch.crates-io]
iceberg = { path = "vendor/iceberg-0.11.0" }
