[package]
name = "rs-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
datafusion = "54.1"
arrow = "58"
iceberg = "0.11"
iceberg-catalog-sql = "0.11"
iceberg-catalog-rest = "0.11"
iceberg-datafusion = "0.11"
futures = "0.3"
# iceberg-catalog-sql 0.11 pulls sqlx with only feature "any" and no runtime;
# without this the catalog panics at connect time ("either the
# `runtime-async-std` or `runtime-tokio` feature must be enabled").
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }

[profile.dev]
debug = 0
